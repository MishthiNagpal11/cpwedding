<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Chirag &amp; Parnika – Wedding Invitation</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Playfair+Display:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="lock">
    <button id="env" aria-label="Tap the envelope to open your invitation">
      <div class="ebox">
        <div class="env">
          <div class="letter"></div>
          <div class="pocket"></div>
          <div class="flap"></div>
          <span class="fl">❀</span
          ><img class="logo" src="images/logo.png" alt="C &amp; P monogram" />
        </div>
        <h1 class="script">You’re Invited</h1>
        <p>Tap the envelope to open your invitation</p>
      </div>
    </button>

    <section id="welcome">
      <div class="bgl" id="sky"></div>
      <div class="in2 rv">
        <div id="fam"></div>
        <span class="nm script" id="n1"></span><span class="wi">with</span
        ><span class="nm script" id="n2"></span>
        <div id="bf"></div>
      </div>
    </section>

    <section id="save">
      <div class="c rv">
        <h2>SAVE THE DATE</h2>
        <div class="card" id="card">
          <div class="rev">
            <small>THE WEDDING</small>
            <div id="dt"></div>
          </div>
          <canvas
            id="cv"
            aria-label="Scratch to reveal the wedding date"
          ></canvas
          ><span class="pill">✦ SCRATCH TO REVEAL ✦</span>
        </div>
        <div class="cd" id="cd" aria-live="off"></div>
      </div>
    </section>

    <section id="events">
      <span class="orn">❀</span>
      <h2 class="t rv">Events Schedule</h2>
      <div class="ev" id="ev"></div>
    </section>

    <section id="garden">
      <div class="rv" style="position: relative">
        <span class="orn">❀</span>
        <h2 class="t" style="margin-bottom: 14px">
          Awaiting Your Heartly Presence
        </h2>
        <p>
          Because celebrating two souls becoming one deserves all your love,
          laughter and blessings.
        </p>
      </div>
    </section>

    <section id="family">
      <div class="rv">
        <div class="lbl">WITH LOVE</div>
        <h2 id="fh"></h2>
        <p id="fl"></p>
      </div>
    </section>

    <section id="venue">
      <div class="rv">
        <h2>Where We Celebrate</h2>
        <h3 id="vn"></h3>
        <p id="vc"></p>
        <a class="btn" id="vm" target="_blank" rel="noopener">Get Directions</a>
      </div>
    </section>

    <footer>
      <p class="script" id="fn"></p>
      <p id="fd"></p>
      <p id="fh2"></p>
    </footer>
    <button id="mus" aria-label="Play music" aria-pressed="false">♪</button>

    <script src="script.js"></script>
  </body>
</html>
